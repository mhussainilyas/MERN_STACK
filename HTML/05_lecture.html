<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Table</title>
  </head>
  <body>
    <table border="1">
      <caption>
        This is table caption
      </caption>

      <thead>
        <tr>
          <th></th>
          <th>Mon</th>
          <th>Tue</th>
          <th>Wed</th>
          <th>Thu</th>
          <th>Fri</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>1</td>
          <td>Geo</td>
          <td>Eng</td>
          <td>Urd</td>
          <td>Sci</td>
          <td>Mat</td>
        </tr>
        <tr>
          <td rowspan="2">2</td>
          <td>Geo</td>
          <td>Eng</td>
          <td>Urd</td>
          <td>Sci</td>
          <td>Mat</td>
        </tr>
        <tr>
          <!-- <td>3</td> -->
          <td>Geo</td>
          <td>Eng</td>
          <td>Urd</td>
          <td>Sci</td>
          <td>Mat</td>
        </tr>
      </tbody>

      <tfoot>
        <tr>
          <td colspan="6">This is table footer</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
