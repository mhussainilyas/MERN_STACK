<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Html form</title>
  </head>
  <body>
    <h1>Registration Form</h1>
    <form>
      <div>
        <label for="FirstName">First Name: </label>
        <input id="FirstName" type="text" placeholder="ENTER First NAME" />
      </div>

      <div>
        <label for="LastName">Last Name: </label>
        <input id="LastName" type="text" placeholder="ENTER Last NAME" />
      </div>

      <div>
        <label for="Email">Email: </label>
        <input id="Email" type="text" placeholder="Enter Email Adress" />
      </div>

      <div>
        <label for="Password">Password: </label>
        <input id="Password" type="Password" />
      </div>

      <div>
        <span>Gender:</span><br />
        <input type="radio" name="Gender" />Male <br />
        <input type="radio" name="Gender" />Female <br />
        <input type="radio" name="Gender" />Others <br />
      </div>

      <div>
        <label for="Age">Age:</label>
        <input type="number" id="Age" /><br />
      </div>

      <div>
        <span>Prefrances :</span><br />
        <input type="checkbox" />Acrylic Painting <br />
        <input type="checkbox" />Oil Painting <br />
        <input type="checkbox" />Water cooler Painting <br />
      </div>

      <div>
        <span> Select Occupation</span>
        <select>
          <option>Student</option>
          <option>I am passionate frontend Developer</option>
          <option>Gardner</option>
          <option>Crickter</option>
        </select>
      </div>
      <br />

      <div>
        <label for="bio">Bio</label>
        <textarea
          id="bio"
          rows="7"
          cols="28"
          placeholder="Share few lines about yourself.."
        ></textarea>
      </div>

      <div>
        <input type="reset" />
        <input type="submit" />
      </div>
    </form>
  </body>
</html>
